name: TextMorphShowcase
options:
  bundleIdPrefix: io.github.dim971.textmorph
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TextMorph:
    path: ..

targets:
  TextMorphShowcase:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: TextMorph
        product: TextMorph
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TextMorph
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dim971.textmorph.showcase
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

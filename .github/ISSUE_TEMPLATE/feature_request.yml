name: Feature request
description: Suggest something this library should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This library is a port. If the feature exists in
        [upstream Torph](https://torph.lochie.me), say so, because that makes it
        a gap rather than a new idea, and it gets treated differently.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem, rather than the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
    validations:
      required: false

  - type: dropdown
    id: upstream
    attributes:
      label: Does upstream have this?
      options:
        - "Yes, this port is missing it"
        - "No, it would be new"
        - "Not sure"
    validations:
      required: true
